steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ev-charging-frontend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ev-charging-frontend:$SHORT_SHA'
      - '.'

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/ev-charging-frontend:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'ev-charging-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/ev-charging-frontend:latest'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '256Mi'
      - '--timeout'
      - '3600'
      - '--max-instances'
      - '100'

images:
  - 'gcr.io/$PROJECT_ID/ev-charging-frontend:latest'
  - 'gcr.io/$PROJECT_ID/ev-charging-frontend:$SHORT_SHA'

timeout: '1800s'
options:
  machineType: 'N1_HIGHCPU_8'
